<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiple Image Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #eaf3fa;
      font-family: 'Segoe UI', sans-serif;
    }
    .main-title {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 2rem;
      color: #2c3e50;
    }
    .result-card {
      background-color: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    .result-card img {
      border-bottom: 1px solid #dee2e6;
    }
    .result-header {
      font-size: 1.1rem;
      font-weight: 500;
      color: #34495e;
    }
    .confidence-badge {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="text-center">
    <h1 class="main-title">Multiple Image Results</h1>
  </div>

  <!-- Results Grid -->
  <div class="row row-cols-1 row-cols-md-3 g-4">
    {% for result in results %}
    <div class="col">
      <div class="card result-card h-100">
        <img src="/{{ result.image_path }}" class="card-img-top" alt="Uploaded Image">
        <div class="card-body">
          <h5 class="result-header d-flex justify-content-between align-items-center">
            <span data-bs-toggle="tooltip" data-bs-placement="top" title="{{ result.prediction_info.desc }}">
              {{ result.class_name }}
            </span>
            <span class="badge {% if result.confidence >= 90 %}bg-success{% elif result.confidence >= 70 %}bg-warning{% else %}bg-danger{% endif %} confidence-badge">
              {{ result.confidence | round(2) }}%
            </span>
          </h5>
          <p class="mb-0">
            <strong>{{ result.prediction_info.name }}</strong>
          </p>
          <small class="text-muted d-block mt-1">{{ result.prediction_info.desc }}</small>
        </div>
        <div class="card-footer bg-white border-0">
          <button class="btn btn-sm btn-outline-primary w-100" onclick="window.location.href='/detailed-view?image_path={{ result.image_path }}'">
            View Detailed Analysis
          </button>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

  <!-- Action Buttons -->
  <div class="mt-5 text-center">
    <a href="/" class="btn btn-outline-secondary">Upload New Images</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
  tooltipTriggerList.map(function (tooltipTriggerEl) {
    return new bootstrap.Tooltip(tooltipTriggerEl);
  });
</script>
</body>
</html>
