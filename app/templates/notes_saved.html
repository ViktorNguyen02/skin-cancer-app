<!DOCTYPE html>
<html>
<head>
    <title>Notes Saved</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-center py-5">
    <div class="container">
        <div class="alert alert-success shadow-sm">
            <h4 class="mb-3">✅ Notes Saved Successfully</h4>
            {% if patient_id %}
                <p>For Patient: <strong>{{ patient_id }}</strong></p>
            {% endif %}
            <p>Your clinical notes were recorded in our system.</p>
            <a href="/" class="btn btn-outline-primary mt-3">Upload Another Image</a>
        </div>
    </div>
</body>
</html>
